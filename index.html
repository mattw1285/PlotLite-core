<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/mattw1285/PlotLite/main/assets/plotlite-logo.svg">
    
    <title>PlotLite</title>

    <link rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="anonymous"
    />

<style>  
:root {
    font-family: sans-serif;
    
    --pl-clr: #007e30;
    --pl-clr-second: #f0f7f2;
    --pl-clr-subtle: #C0C0C0;
    --pl-background: #FFFFFF;
    --pl-logo: url('https://raw.githubusercontent.com/mattw1285/PlotLite/main/assets/plotlite-logo.svg');
    --pl-roundness: 8px;
    --pl-shadow: 0 4px 4px rgba(0, 0, 0, 0.25);
}

.plotlite-logo {
    -webkit-mask: var(--pl-logo) no-repeat center / contain;
    mask: var(--pl-logo) no-repeat center / contain;
    
    stroke: var(--pl-clr);
    background-color: var(--pl-clr);
}


/* --- icon masks --- */
.icon {  
    stroke: var(--pl-clr-subtle);
    background-color: var(--pl-clr-subtle);

    width: 100%;
    height: 100%;

    -webkit-mask: var(--svg) no-repeat center / contain;
    mask: var(--svg) no-repeat center / contain;
}
.icon-github{
    --svg: url('https://raw.githubusercontent.com/mattw1285/PlotLite/main/assets/github.svg');
}
.icon-license {
    --svg: url('https://raw.githubusercontent.com/mattw1285/PlotLite/main/assets/license.svg');
}
.icon-author {
    --svg: url('https://raw.githubusercontent.com/mattw1285/PlotLite/main/assets/signature.svg');
}


/* --- main body and positioning ---*/
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

/* --- header --- */
header {
    position: absolute;
    inset: 10px 0 0 0;
    margin-inline: auto;

    width: 750px;
    max-width: calc(100% - 20px);
    height: 75px;

    display: grid;
    grid-template-columns: 20% auto 20%;
    align-items: center;

    background-color: var(--pl-background);
    border-radius: var(--pl-roundness);
    box-shadow: var(--pl-shadow);

    z-index: 1000;
    padding: 0px 10px;
}

header h1 {
    grid-column: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;

    margin: 0;
    white-space: nowrap;

    font-size: 2rem;
    color: var(--pl-clr);
}
header h1 .plotlite-logo {
    height: 50px;
    width: 50px;
}

header aside {
    grid-column: 3;
}
header aside nav {
    display: flex;
    flex-direction: row;
    justify-content: flex-end;
}
header aside nav a {
    --tile-size: 50px;

    width: var(--tile-size);
    height: var(--tile-size);
    padding: 5%;
    border-radius: var(--pl-roundness);

    transition: background-color 150ms ease;
}
header aside nav a:hover {
    background-color: var(--pl-clr-second);
}
header aside nav a:hover .icon{
    stroke: var(--pl-clr);
    background-color: var(--pl-clr);
}
header aside nav a:active {
    transform: translateY(0) scale(0.94);
}
header aside nav a:focus-visible {
    outline: 2px solid var(--pl-clr);
    outline-offset: 3px;
}


/* --- App Stuff --- */
#map {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 0;
}
</style>
</head>

<body>
    <header id="header">
        <h1>
            <div class="plotlite-logo"></div>
            PlotLite-lite
        </h1>

        <aside><nav>
            <a href="https://github.com/mattw1285/PlotLite-lite" 
                target="_blank"  
                rel="noopener noreferrer"
                class="link-tile"
            >
                <div class="icon icon-github"></div>
            </a>

            <a href="./LICENSE.md" 
                rel="noopener noreferrer"
                class="link-tile"
            >
                <div class="icon icon-license"></div>
            </a>

            <a href="https://mattw1285.github.io/" 
                target="_blank" 
                rel="noopener noreferrer"
                class="link-tile"
            >
                <div class="icon icon-author"></div>
            </a>
        </nav></aside>
    </header>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="anonymous"
    ></script>

<script>      
const map = L.map(
    'map',
    {
        zoomControl: false,
        maxBounds: [
            [-85.05, -180],
            [85.05, 180]
        ],
        maxBoundsViscosity: 1.0
    }
).setView([54.9974, -1.457], 19);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        minZoom: 3,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'     
    }
).addTo(map);

L.control.zoom({
    position: 'bottomright'
}).addTo(map);
</script>
</body>
</html>
