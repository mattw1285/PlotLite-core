<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    
    <title>PlotLite</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    
    <style></style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="logo">PlotLite</div>
    <button onclick="newProject()">New</button>
    <button onclick="document.getElementById('file').click()">Import</button>
    <button onclick="exportGeoJSON()">Export</button>
    <button onclick="saveLocal()">Save</button>
    <button onclick="loadLocal()">Load</button>
    <span style="width:1px;height:25px;background:#ddd;margin:0 4px"></span>
    <button onclick="undo()">Undo</button>
    <button onclick="redo()">Redo</button>
    <input id="file" type="file" accept=".geojson,.json">
  </div>

  <div id="main">
    <aside id="left">
      <div class="panel-title">Layers <span id="layer-count"></span></div>
      <div id="layers"></div>
      <button id="add-layer" onclick="addLayer()">+ Add layer</button>
    </aside>

    <div id="map"></div>

    <aside id="right">
      <div class="panel-title">Feature</div>
      <div id="properties"><div class="muted">Click a feature to edit its properties.</div></div>
    </aside>
  </div>

  <div id="status">
    <span id="coords">—</span>
    <span id="count">0 features</span>
    <span id="active">Layer: —</span>
  </div>
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./script.js"></script>
    
</body>
</html>
