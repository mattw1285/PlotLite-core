<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/mattw1285/PlotLite/main/assets/plotlite-logo.svg">
    
    <title>PlotLite</title>

    <link rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="anonymous"
    />

    <link rel="stylesheet" href="./style.css"/>
</head>

<body>
    <header id="header">
        <h1>
            <div class="plotlite-logo"></div>
            PlotLite-lite
        </h1>

        <aside><nav>
            <a href="https://github.com/mattw1285/PlotLite-lite" 
                target="_blank"  
                rel="noopener noreferrer"
                class="link-tile"
            >
                <div class="icon icon-github"></div>
            </a>

            <a href="./LICENSE.md" 
                rel="noopener noreferrer"
                class="link-tile"
            >
                <div class="icon icon-license"></div>
            </a>

            <a href="https://mattw1285.github.io/" 
                target="_blank" 
                rel="noopener noreferrer"
                class="link-tile"
            >
                <div class="icon icon-author"></div>
            </a>
        </nav></aside>
    </header>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="anonymous"
    ></script>

<script>      
const map = L.map(
    'map',
    {
        zoomControl: false,
        maxBounds: [
            [-85.05, -180],
            [85.05, 180]
        ],
        maxBoundsViscosity: 1.0
    }
).setView([54.9974, -1.457], 19);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        minZoom: 3,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'     
    }
).addTo(map);

L.control.zoom({
    position: 'bottomright'
}).addTo(map);
</script>
</body>
</html>
